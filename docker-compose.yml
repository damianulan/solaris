services:
    # PHP / solaris app
    app:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.4}
        container_name: solaris_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        environment:
            APP_ROLE: app
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: solaris
            DB_USERNAME: solaris
            DB_PASSWORD: secret
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RUN_MIGRATIONS: "1"
            RUN_OPTIMIZE: "0"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - solaris

    # Nginx
    nginx:
        image: nginx:latest
        container_name: solaris_nginx
        restart: unless-stopped
        ports:
            - "37002:80"
        volumes:
            - .:/var/www
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - solaris

    # MySQL
    mysql:
        image: mysql:8.4
        container_name: solaris_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: solaris
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: secret
            MYSQL_USER: solaris
        ports:
            - "33006:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - solaris

    # Redis
    redis:
        image: redis:latest
        container_name: solaris_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - solaris

networks:
    solaris:

volumes:
    mysql_data:
